<!DOCTYPE html>
<html>
<head>
    <title>New Staff</title>
    <style>
        body {
            font-size: 40px;
        }

        input {
            font-size: 40px;
            width: 90%;
        }

        button {
            font-size: 40px;
            padding: 20px 40px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Add New Staff Member</h1>

    <form action="/new_staff" method="POST">

        <p>
            <label>Staff Name:</label><br>
            <input type="text" name="staff_name" required>
        </p>

        <p>
            <label>Org ID:</label><br>
            <input type="text" name="org_id" required>
        </p>

        <p>
            <label>Role:</label><br>
            <input type="text" name="staff_role" required>
        </p>

        <p>
            <label>Phone:</label><br>
            <input type="text" name="staff_phone" required>
        </p>

        <p>
            <label>Email:</label><br>
            <input type="text" name="staff_email" required>
        </p>

        <button type="submit">Submit New Staff</button>

    </form>

    <br>
    <a href="/admin">← Back to Admin Dashboard</a>

</body>
</html>
