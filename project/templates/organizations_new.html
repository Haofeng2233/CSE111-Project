<!DOCTYPE html>
<html>
<head>
    <title>New Organization</title>
    <style>
        body { font-size: 40px; }
        input { font-size: 40px; width: 90%; }
        button { font-size: 40px; padding: 20px 40px; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Add New Organization</h1>

    <form action="/new_org" method="POST">

        <p>
            <label>Org Name:</label><br>
            <input type="text" name="org_name" required>
        </p>

        <p>
            <label>Phone:</label><br>
            <input type="text" name="org_phone" required>
        </p>

        <p>
            <label>Email:</label><br>
            <input type="text" name="org_email" required>
        </p>

        <p>
            <label>Address:</label><br>
            <input type="text" name="org_address" required>
        </p>

        <button type="submit">Submit New Org</button>

    </form>

    <br>
    <a href="/admin">← Back to Admin Dashboard</a>

</body>
</html>
