<!DOCTYPE html>
<html>
<head>
    <title>Pet Details</title>
    <style>
        body {
            font-size: 40px;
        }

        button {
            font-size: 40px;   
            padding: 20px 40px;
        }
    </style>
</head>
<body>

    <h1>Pet Details</h1>

    {% if pet %}
        <p><strong>Pet ID:</strong> {{ pet[0] }}</p>
        <p><strong>Name:</strong> {{ pet[1] }}</p>
        <p><strong>Species:</strong> {{ pet[2] }}</p>
        <p><strong>Breed:</strong> {{ pet[3] }}</p>
        <p><strong>Age:</strong> {{ pet[4] }}</p>
        <p><strong>Gender:</strong> {{ pet[5] }}</p>
        <p><strong>Status:</strong> {{ pet[6] }}</p>
    {% else %}
        <p>No pet found.</p>
    {% endif %}

    <button type="button" onclick="window.location.href='/apply/{{ pet[0] }}'">
        Adopt Me!
    </button>

    <br><br>
    <a href="/browse_pets">← Back to All Pets</a>

</body>
</html>
