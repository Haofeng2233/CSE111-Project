<!DOCTYPE html>
<html>
<head>
    <title>Add Pet</title>
    <style>
        body { font-size: 40px; }
        input, select { font-size: 32px; padding: 10px; margin: 10px; }
        button { font-size: 35px; padding: 15px; }
    </style>
</head>
<body>

<ul>
    <li>
        <a href="/staff/{{ staff[0] }}" style="font-size: 32px;">← Back to Staff Page</a>
    </li>
</ul>

<h1>Add New Pet</h1>

<form action="/add_pet" method="post">

    <input type="hidden" name="staff_id" value="{{ staff[0] }}">

    <label>Name:</label><br>
    <input type="text" name="name" required><br>

    <label>Species:</label><br>
        <select name="species">
        <option>Dog</option>
        <option>Cat</option>
    </select><br>

    <label>Breed:</label><br>
    <input type="text" name="breed" required><br>

    <label>Age:</label><br>
    <input type="number" name="age" required><br>

    <label>Gender:</label><br>
    <select name="gender">
        <option>Male</option>
        <option>Female</option>
    </select><br>

    <label>Organization:</label><br>
    <input type="text" name="org" required><br>

    <button type="submit">Add Pet</button>
</form>

</body>
</html>
